<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Hair -->
  <rect x="4" y="0" width="8" height="2" fill="#2a2a2a" />
  <rect x="3" y="1" width="10" height="1" fill="#2a2a2a" />
  <rect x="3" y="2" width="10" height="2" fill="#2a2a2a" />
  <!-- Face -->
  <rect x="4" y="4" width="8" height="5" fill="#e5b485" />
  <rect x="3" y="4" width="1" height="4" fill="#e5b485" />
  <rect x="12" y="4" width="1" height="4" fill="#e5b485" />
  <!-- Eyes & Glasses -->
  <rect x="5" y="5" width="2" height="2" fill="#ffffff" />
  <rect x="9" y="5" width="2" height="2" fill="#ffffff" />
  <rect x="6" y="6" width="1" height="1" fill="#111111" />
  <rect x="10" y="6" width="1" height="1" fill="#111111" />
  <!-- Glasses Frames -->
  <rect x="4" y="5" width="1" height="3" fill="#111111" />
  <rect x="7" y="5" width="2" height="1" fill="#111111" />
  <rect x="11" y="5" width="1" height="3" fill="#111111" />
  <rect x="5" y="4" width="2" height="1" fill="#111111" />
  <rect x="9" y="4" width="2" height="1" fill="#111111" />
  <rect x="5" y="7" width="2" height="1" fill="#111111" />
  <rect x="9" y="7" width="2" height="1" fill="#111111" />
  <!-- Chin shadow -->
  <rect x="7" y="8" width="2" height="1" fill="#c2956c" />
  <!-- Jacket -->
  <rect x="3" y="9" width="10" height="4" fill="#2E4C38" />
  <rect x="2" y="10" width="1" height="3" fill="#2E4C38" />
  <rect x="13" y="10" width="1" height="3" fill="#2E4C38" />
  <!-- Collar shadow -->
  <rect x="4" y="9" width="8" height="1" fill="#1F3325" />
  <!-- Inner shirt showing -->
  <rect x="7" y="10" width="2" height="3" fill="#dddddd" />
  <!-- Hands -->
  <rect x="1" y="10" width="2" height="3" fill="#e5b485" />
  <rect x="13" y="10" width="2" height="3" fill="#e5b485" />
  <!-- Pants -->
  <rect x="4" y="13" width="3" height="2" fill="#222222" />
  <rect x="9" y="13" width="3" height="2" fill="#222222" />
  <!-- Shoes -->
  <rect x="4" y="15" width="3" height="1" fill="#f0f0f0" />
  <rect x="9" y="15" width="3" height="1" fill="#f0f0f0" />
</svg>